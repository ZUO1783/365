<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1c1510">
<title>Entering the game...</title>
<!--
  Permanent entry page. 100% ASCII on purpose:
  non-ASCII text got mangled (UTF-8 read as GBK) when pasted through the
  clipboard / editor, which even broke the JavaScript. ASCII cannot be
  misinterpreted, so this file is safe to paste, upload, or edit anywhere.

  It reads the current tunnel URL from ntfy (the host PC publishes it
  automatically whenever the tunnel changes), so the QR code stays valid
  forever even though the tunnel domain changes on every restart.
-->
<style>
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(900px 520px at 50% 0%,#3a2a1b,#1c1510 62%);
    color:#f2e7d5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;
  }
  .box{max-width:420px}
  .sp{width:34px;height:34px;margin:0 auto 18px;border:3px solid rgba(217,164,65,.28);
      border-top-color:#d9a441;border-radius:50%;animation:s .9s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  #m{font-size:17px;font-weight:600;margin:0 0 10px}
  .hint{font-size:13px;line-height:1.7;color:#a9967c;margin:0 0 10px}
  a{display:inline-block;margin-top:12px;padding:11px 22px;background:#d9a441;color:#241608;
    text-decoration:none;border-radius:10px;font-weight:600;font-size:14px}
  #e{display:none;font-size:13px;line-height:1.7;color:#e0a08a;margin-top:16px}
</style>
</head>
<body>
<div class="box">
  <div class="sp" id="sp"></div>
  <p id="m">Entering the game...</p>
  <p class="hint">Takes about 1 second.</p>
  <a id="g" href="#">Tap here to enter</a>
  <p id="e">Host PC seems offline. Please try again later, or ask the host to turn the computer on.</p>
</div>
<script>
(function () {
  var TOPIC = 'zuo1783-gobang-8f3k2';
  var g = document.getElementById('g');
  var e = document.getElementById('e');
  var sp = document.getElementById('sp');
  var m = document.getElementById('m');

  function fail() {
    sp.style.display = 'none';
    m.textContent = 'Cannot enter right now';
    e.style.display = 'block';
  }

  function go(u) {
    if (!/^https?:\/\//i.test(u)) { fail(); return; }
    g.href = u;
    try { location.replace(u); } catch (err) { /* user can tap the button */ }
  }

  fetch('https://ntfy.sh/' + TOPIC + '/raw?poll=1&since=all', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.text() : ''; })
    .then(function (t) {
      var lines = String(t || '').split(/\r?\n/).filter(function (x) {
        return /^https?:\/\//i.test(x.trim());
      });
      if (lines.length) { go(lines[lines.length - 1].trim()); return; }
      throw new Error('empty');
    })
    .catch(function () { fail(); });

  setTimeout(function () {
    if (g.getAttribute('href') === '#') fail();
  }, 6000);
})();
</script>
</body>
</html>
